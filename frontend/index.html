<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Manager</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-icon">C</div>
          <div>
            <p class="eyebrow">Workspace</p>
            <h1>Contact Manager</h1>
          </div>
        </div>
        <button id="logoutBtn" class="secondary-btn hidden">Logout</button>
      </header>

      <main>
        <section id="authSection" class="auth-panel card ">
          <div class="tabs">
            <button class="tab-btn active" data-tab="login">Login</button>
            <button class="tab-btn" data-tab="register">Register</button>
          </div>

          <form id="loginForm" class="auth-form active">
            <h2>Welcome back</h2>
            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="you@example.com" required />
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••" required />
            <button type="submit" class="primary-btn">Login</button>
          </form>

          <form id="registerForm" class="auth-form">
            <h2>Create account</h2>
            <label>Name</label>
            <input type="text" id="registerName" placeholder="Your name" required />
            <label>Email</label>
            <input type="email" id="registerEmail" placeholder="you@example.com" required />
            <label>Password</label>
            <input type="password" id="registerPassword" placeholder="Create password" required />
            <button type="submit" class="primary-btn">Register</button>
          </form>
        </section>

        <section id="appSection" class="app-shell hidden">
          <div class="stats-grid">
            <div class="stat-card card">
              <span class="stat-label">Profile</span>
              <h3 id="userInfo">Loading...</h3>
            </div>
            <div class="stat-card card">
              <span class="stat-label">Contacts</span>
              <h3 id="contactCount">0</h3>
            </div>
            <div class="stat-card card accent">
              <span class="stat-label">Status</span>
              <h3>Online</h3>
            </div>
          </div>

          <div class="dashboard-grid">
            <div class="card form-box">
              <div class="section-head">
                <h3 id="formTitle">Add Contact</h3>
              </div>

              <form id="contactForm">
                <input type="hidden" id="contactId" />
                <label>Name</label>
                <input type="text" id="contactName" placeholder="John Doe" required />
                <label>Email</label>
                <input type="email" id="contactEmail" placeholder="john@example.com" required />
                <label>Phone</label>
                <input type="tel" id="contactPhone" placeholder="+1 234 567 890" required />
                <div class="form-actions">
                  <button type="submit" class="primary-btn">Save Contact</button>
                  <button type="button" id="cancelEditBtn" class="secondary-btn hidden">Cancel</button>
                </div>
              </form>
            </div>

            <div class="card contact-box">
              <div class="section-head">
                <h3>All Contacts</h3>
                <div class="search-wrap">
                  <input id="searchInput" type="text" placeholder="Search contacts..." />
                </div>
              </div>
              <div id="contactList" class="contact-list"></div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast"></div>

    <script src="./script.js"></script>
  </body>
</html>
